<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AcornFox 工作台</title>
<link rel="stylesheet" href="app.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111111'/%3E%3Cpath d='M7 14c0-4.5 4-7.5 9-7.5s9 3 9 7.5z' fill='%23ffffff'/%3E%3Cpath d='M9 14h14c0 7-3.2 12-7 12s-7-5-7-12z' fill='%239a9a9a'/%3E%3C/svg%3E" />
</head>
<body>
<!-- Top bar -->
<header class="top">
  <div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 13c0-5 4.5-8 10-8s10 3 10 8z" fill="currentColor"/><path d="M8 13h16c0 8-3.5 14-8 14s-8-6-8-14z" fill="currentColor" opacity=".55"/><path d="M16 5V2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>AcornFox</div>
  <span class="server" id="server-label"></span>
  <div class="grow"></div>
  <div class="health" id="health" aria-live="polite"></div>
  <button class="iconbtn" id="theme" type="button" aria-label="切换深浅色">◐</button>
</header>

<!-- Desktop -->
<main class="desk" id="desk" aria-label="工作台"></main>

<!-- Dock -->
<nav class="dock" id="dock" aria-label="工具栏"></nav>

<!-- Live toast -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Confirm dialog -->
<div class="overlay" id="confirm-overlay" hidden></div>
<div class="dialog" id="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title" hidden>
  <h3 id="confirm-title"></h3>
  <p id="confirm-body"></p>
  <div class="row row-end">
    <button class="btn" type="button" id="confirm-cancel">取消</button>
    <button class="btn danger" type="button" id="confirm-ok"></button>
  </div>
</div>

<script src="app.js" type="module"></script>
</body>
</html>
