      properties:
        expected_version: {type: string, minLength: 1}
        enabled: {type: boolean}
        profile: {type: string, enum: [china, global, local, disabled]}
        provider: {type: string}
        model: {type: string}
        data_scopes: {type: array, items: {type: string}}
        max_tokens: {type: integer, minimum: 1}
        max_duration_ms: {type: integer, format: int64, minimum: 1}
        cooldown_seconds: {type: integer, format: int64, minimum: 0}
        cache_enabled: {type: boolean}
    OpaqueSecretReference:
