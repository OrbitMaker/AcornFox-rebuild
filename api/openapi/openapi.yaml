        network_rx_bytes: {type: integer, format: int64, minimum: 0}
        network_tx_bytes: {type: integer, format: int64, minimum: 0}
        restart_count: {type: integer, format: int64, minimum: 0}
        pids_current: {type: integer, format: int64, minimum: 0}
        applied_cpu_millicores: {type: integer, format: int64, minimum: 0}
        applied_memory_bytes: {type: integer, format: int64, minimum: 0}
        applied_pids: {type: integer, format: int64, minimum: 0}
        changed_path_count: {type: integer, format: int64, minimum: 0}
