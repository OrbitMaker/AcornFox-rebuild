      properties:
        max_tokens: {type: integer, minimum: 1}
        max_duration_ms: {type: integer, format: int64, minimum: 1}
        max_actions: {type: integer, minimum: 1}
    AIAction:
      type: object
      additionalProperties: false
      required: [tool_id, tool_version, risk, expected_result, validation_id]
      properties:
        tool_id: {type: string}
        tool_version: {type: string}
        parameters: {type: object, description: Redacted parameters accepted only after catalog schema validation}
