            delivery_id: {type: string}
            event_id: {type: string}
            status: {type: string, enum: [pending, delivered, failed]}
            attempts: {type: integer, minimum: 0}
            delivered: {type: boolean}
            payload_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
