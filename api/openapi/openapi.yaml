      properties:
        id: {type: string}
        schema_version: {type: string, enum: ['1.0']}
        policy_version: {type: string}
        task_type: {type: string}
        target_refs: {type: object, additionalProperties: {type: string}}
        sources: {type: array, minItems: 1, items: {type: string}}
        assumptions: {type: array, items: {type: string}}
        evidence_refs: {type: array, minItems: 1, items: {type: object}}
        actions: {type: array, minItems: 1, items: {$ref: '#/components/schemas/AIAction'}}
        budget: {$ref: '#/components/schemas/AIPlanBudget'}
        rollback_id: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
