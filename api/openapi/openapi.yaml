        version: {type: string}
        mode: {type: string, enum: [ordinary, operator]}
        ai_status: {type: string, enum: [disabled, unavailable, available]}
        items: {type: array, items: {$ref: '#/components/schemas/AIInterventionFact'}}
        success_count: {type: integer, minimum: 0}
        failure_count: {type: integer, minimum: 0}
        rollback_count: {type: integer, minimum: 0}
        candidate_count: {type: integer, minimum: 0}
        total_tokens: {type: integer, format: int64, minimum: 0}
        total_duration_ms: {type: integer, format: int64, minimum: 0}
    AIInterventionRequest:
