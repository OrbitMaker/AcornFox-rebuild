        application_id: {type: string}
        task_type: {type: string}
        status: {type: string, enum: [manual_fallback, awaiting_confirmation, controller_handoff, running, succeeded, failed, rolled_back]}
        reason: {type: string}
        summary: {type: string}
        suggestion: {type: string}
        requires_user_action: {type: boolean}
        controller_handoff: {type: boolean}
        provider: {type: string}
        model: {type: string}
        profile: {type: string, enum: [china, global, local, disabled]}
        context_manifest_digest: {type: string}
        plan: {$ref: '#/components/schemas/AIActionPlan'}
        evidence: {type: array, items: {type: object}}
        tokens: {type: integer, format: int64, minimum: 0}
        duration_ms: {type: integer, format: int64, minimum: 0}
        rolled_back: {type: boolean}
        rule_candidate_id: {type: string}
        created_at: {type: string, format: date-time}
    AIInterventionView:
      type: object
      additionalProperties: false
