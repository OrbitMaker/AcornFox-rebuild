openapi: 3.0.3
info:
  title: Open Card Control Plane API
  version: 1.1
  description: >-
    REST JSON and persistent SSE control-plane endpoints. Product state remains owned by the
    control plane; provider and agent endpoints are versioned contracts. API clients may send
    an exact Open-Card-API-Version header or an Open-Card-API-Min-Version and
    Open-Card-API-Max-Version range. All version headers are optional for backwards
    compatibility: clients that omit them negotiate the legacy 1.0 contract. Requests with
    no common supported version receive 426 Upgrade Required.
servers:
  - url: /
security:
  - AdministratorSession: []
paths:
  /healthz:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Process is alive
  /readyz:
    get:
      operationId: readiness
      responses:
        '200':
          description: Process is ready
        '503':
          description: Process is not ready
  /api/v1/auth/login:
    post:
      operationId: loginAdministrator
      security: []
      description: >-
        Creates one cookie-bound administrator session. The password, session token, CSRF token,
        and source address are never returned in the JSON body or persisted as plaintext.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthLoginRequest'}
      responses:
        '200':
          description: Authenticated session. The browser receives Secure Strict cookies.
          headers:
            Set-Cookie: {description: Session and CSRF cookies, schema: {type: string}}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSessionResponse'}
        '400': {description: Invalid JSON request}
        '401': {description: Generic authentication failure}
        '429': {description: Generic authentication failure while rate limited}
        '503': {description: Authentication persistence unavailable}
  /api/v1/auth/logout:
    post:
      operationId: logoutAdministrator
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string, format: uri}}
        - {name: X-Open-Card-CSRF, in: header, required: true, schema: {type: string, minLength: 1}}
      responses:
        '204': {description: Session revoked and both cookies cleared}
        '401': {description: Generic authentication or CSRF failure}
        '503': {description: Authentication persistence unavailable}
  /api/v1/auth/session:
    get:
      operationId: getAdministratorSession
      responses:
        '200':
          description: Active session facts only; no credential or token material.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSessionResponse'}
        '401': {description: Generic authentication failure}
        '503': {description: Authentication persistence unavailable}
  /api/v1/auth/password:
    post:
      operationId: rotateAdministratorPassword
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string, format: uri}}
        - {name: X-Open-Card-CSRF, in: header, required: true, schema: {type: string, minLength: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthPasswordChangeRequest'}
      responses:
        '204': {description: Credential version advanced and both cookies cleared}
        '400': {description: Password policy or JSON request rejected}
        '401': {description: Generic authentication or CSRF failure}
        '503': {description: Authentication persistence unavailable}
  /api/v1/applications:
    parameters:
      - $ref: '#/components/parameters/APIVersion'
      - $ref: '#/components/parameters/APIMinVersion'
      - $ref: '#/components/parameters/APIMaxVersion'
    get:
      operationId: listApplications
      responses:
        '200':
          description: Applications
          headers:
            Open-Card-API-Version:
              $ref: '#/components/headers/APINegotiatedVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationList'
        '426':
          $ref: '#/components/responses/APIUpgradeRequired'
    post:
      operationId: createApplication
      x-open-card-handler-status: implemented
      description: >-
        Creates an application from a claimed upload or a public HTTPS Git
        repository. Git requires an explicit two-resolver public-DNS policy;
        missing or unavailable resolver configuration fails closed with 503.
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: Created
          headers:
            Open-Card-API-Version:
              $ref: '#/components/headers/APINegotiatedVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApplicationResponse'
        '400':
          description: Invalid request
          headers:
            Open-Card-API-Version:
              $ref: '#/components/headers/APINegotiatedVersion'
        '409':
          description: Idempotency key was reused with different input
          headers:
            Open-Card-API-Version:
              $ref: '#/components/headers/APINegotiatedVersion'
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
        '426':
          $ref: '#/components/responses/APIUpgradeRequired'
  /api/v1/applications/{applicationId}:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
      - $ref: '#/components/parameters/APIVersion'
      - $ref: '#/components/parameters/APIMinVersion'
      - $ref: '#/components/parameters/APIMaxVersion'
    get:
      operationId: getApplication
      x-open-card-handler-status: partial_contract
      description: >-
        UI-facing application detail contract. The current handler returns the legacy application
        projection until G3 access/source detail composition is implemented.
      responses:
        '200':
          description: Application
          headers:
            Open-Card-API-Version:
              $ref: '#/components/headers/APINegotiatedVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
        '404':
          description: Not found
          headers:
            Open-Card-API-Version:
              $ref: '#/components/headers/APINegotiatedVersion'
        '426':
          $ref: '#/components/responses/APIUpgradeRequired'
  /api/v1/applications/{applicationId}/publishes:
    post:
      operationId: publishApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/APIVersion'
        - $ref: '#/components/parameters/APIMinVersion'
        - $ref: '#/components/parameters/APIMaxVersion'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationPublishRequest'}}}
      responses:
        '202': {description: Deployment queued, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationPublishResponse'}}}}
        '400': {description: Invalid request}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '409': {$ref: '#/components/responses/StateConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
        '426': {$ref: '#/components/responses/APIUpgradeRequired'}
  /api/v1/settings/system-status:
    get:
      operationId: getSystemStatus
      x-open-card-handler-status: implemented
      description: >-
        Authenticated read-only system settings status. It exposes no provider
        credentials, webhook URLs, secret references, or configuration writes.
      responses:
        '200':
          description: Current system status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemStatus'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  # G3 UI-facing access contracts. These endpoints deliberately do not expose
  # M3 workflow inputs; handler implementation is deferred to later G3 work.
  /api/v1/settings/platform-domain:
    get:
      operationId: getPlatformDomainSettings
      x-open-card-handler-status: partial
      description: >-
        UI-facing platform-domain state. A failed domain or certificate never changes an
        application's runtime or IP fallback address. Without explicit public-DNS resolvers,
        expected public IP, and ingress rules the response is unconfigured and writes fail closed.
      responses:
        '200':
          description: Current platform-domain configuration and convergence state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformDomainSettingsResponse'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    put:
      operationId: putPlatformDomainSettings
      x-open-card-handler-status: partial
      description: >-
        Idempotently configures one platform base domain. The controller derives platform
        addresses as <slug>-<short>.apps.<base_domain>; root domains, CDN and WAF are outside MVP.
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformDomainSettingsRequest'}
      responses:
        '200':
          description: Existing identical configuration returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformDomainSettingsResponse'}
        '202':
          description: Domain verification or certificate convergence is pending.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformDomainSettingsResponse'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '409': {$ref: '#/components/responses/StateConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/applications/{applicationId}/domains:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
    get:
      operationId: listApplicationDomains
      x-open-card-handler-status: partial
      responses:
        '200':
          description: Platform and customer CNAME-only domain bindings for one application.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationDomainsResponse'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    post:
      operationId: bindApplicationCustomDomain
      x-open-card-handler-status: partial
      description: >-
        Binds only a customer hostname. The response supplies the CNAME target; this endpoint
        never writes a customer DNS zone and failures preserve platform/IP access.
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomDomainBindRequest'}
      responses:
        '202':
          description: CNAME binding recorded and awaiting public DNS/certificate convergence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationDomainResponse'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '409': {$ref: '#/components/responses/StateConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/applications/{applicationId}/domains/{domainId}/verify:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
      - $ref: '#/components/parameters/DomainID'
    post:
      operationId: verifyApplicationDomain
      x-open-card-handler-status: partial
      description: >-
        Triggers only public DNS read verification and state convergence. It never creates,
        updates or deletes a DNS record.
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '202':
          description: Verification state was refreshed or remains pending.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationDomainResponse'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/StateConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/applications/{applicationId}/domains/{domainId}:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
      - $ref: '#/components/parameters/DomainID'
    delete:
      operationId: unbindApplicationDomain
      x-open-card-handler-status: partial
      description: Unbinds only the selected custom domain; runtime, IP fallback and platform address remain available.
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '204': {description: Custom domain binding removed without altering fallback access.}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/StateConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/applications/{applicationId}/access:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
    get:
      operationId: getApplicationAccess
      x-open-card-handler-status: partial
      description: >-
        Unified serving, route and certificate projection. Domain/certificate failure never removes
        IP fallback. This facade intentionally reports certificate_pending until a future Caddy
        certificate observation adapter can prove the live edge is serving the certificate.
      responses:
        '200':
          description: Application access facts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationAccessResponse'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/source-uploads:
    post:
      operationId: createSourceUpload
      x-open-card-handler-status: implemented
      description: >-
        Creates a short-lived source upload. archive accepts exactly one .zip, .tar.gz or .tgz
        file. directory accepts repeated files parts whose filenames are normalized relative paths
        and a JSON manifest cross-check; absolute client paths are rejected. File bytes remain in
        private storage and are never returned by this API.
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/SourceUploadRequest'}
            encoding:
              manifest: {contentType: application/json}
      responses:
        '201':
          description: Upload received and content-addressed facts are available.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceUploadResponse'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '409': {$ref: '#/components/responses/StateConflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/source-uploads/{uploadId}:
    parameters:
      - $ref: '#/components/parameters/UploadID'
    get:
      operationId: getSourceUpload
      x-open-card-handler-status: implemented
      description: Read-only upload state for an application-creation reference; storage_ref is never returned.
      responses:
        '200':
          description: Source upload facts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceUploadResponse'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/applications/{applicationId}/operations:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
    get:
      operationId: getApplicationOperations
      responses:
        '200':
          description: Canonical M4 operations facts for this application's default environment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationOperationsBrowserFact'}
        '404': {description: Application or default environment not found}
        '503': {description: Operations facts are not composed or unavailable}
    post:
      operationId: requestApplicationOperationsAction
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApplicationOperationsActionRequest'}
      responses:
        '202':
          description: Request accepted; UI must await a newer operations fact version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationsActionResponse'}
        '400': {description: Invalid or incomplete audit request}
        '401': {description: Administrator session required}
        '409': {description: Stale fact version, active operation, or idempotency conflict}
        '503': {description: Typed operation not available}
  /api/v1/applications/{applicationId}/usage:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
      - $ref: '#/components/parameters/APIVersion'
      - $ref: '#/components/parameters/APIMinVersion'
      - $ref: '#/components/parameters/APIMaxVersion'
    get:
      operationId: getApplicationUsage
      description: >-
        Reads local aggregate usage facts from independent runtime observations. The interval is
        UTC and half-open [from,to). Ordinary mode is a comprehensible summary; operations mode
        includes service/release/time trends, actual values, configured limits, and evidence-linked
        anomalies. No price, plan, order, payment, balance, invoice, or regional claim is returned.
      parameters:
        - {name: mode, in: query, schema: {type: string, enum: [normal, operations], default: normal}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: service, in: query, schema: {type: string, maxLength: 128}}
        - {name: release, in: query, schema: {type: string}}
      responses:
        '200':
          description: Application-scoped M5 usage facts. AI remains disabled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationUsageFact'}
        '400': {description: Invalid filter or a window longer than 31 days}
        '401': {description: Administrator session required}
        '404': {description: Application not found}
        '503': {description: Local meter or usage persistence unavailable}
  /api/v1/applications/{applicationId}/usage/context:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
    get:
      operationId: getAuthorizedUsageSummaryContext
      description: >-
        Optional aggregate-only query surface for a future controlled AI caller. It is disabled by
        default, requires an administrator session, and never returns raw observations.
      parameters:
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {description: Authorized aggregate-only usage context}
        '401': {description: Administrator session required}
        '503': {description: Local usage facts unavailable}
  /api/v1/applications/{applicationId}/ai/interventions:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
    get:
      operationId: listApplicationAIInterventions
      description: AI intervention analysis embedded in operations. It is not a release or runtime success source.
      parameters:
        - {name: mode, in: query, schema: {type: string, enum: [ordinary, operator], default: ordinary}}
      responses:
        '200': {description: Ordinary summary or redacted operator ledger, content: {application/json: {schema: {$ref: '#/components/schemas/AIInterventionView'}}}}
        '401': {description: Administrator session required}
        '503': {description: Controlled AI composition unavailable}
    post:
      operationId: requestApplicationAIIntervention
      description: Explicitly requests controlled fallback after a rule miss/conflict/failure. Production changes are never executed here.
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AIInterventionRequest'}
      responses:
        '202': {description: Bounded intervention accepted; completion still requires independent verification}
        '200': {description: Disabled/manual/confirmation/controller-handoff response; no action claimed successful}
        '400': {description: Invalid task, expected version, or audit reason}
        '401': {description: Administrator session required}
        '409': {description: Stale fact version or idempotency conflict}
        '503': {description: Controlled AI unavailable; deterministic/manual paths remain available}
  /api/v1/settings/ai:
    get:
      operationId: getAIServiceSettings
      responses:
        '200': {description: Versioned controlled AI service settings, content: {application/json: {schema: {$ref: '#/components/schemas/AIServiceSettings'}}}}
        '401': {description: Administrator session required}
        '503': {description: AI settings persistence unavailable}
    put:
      operationId: updateAIServiceSettings
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AIServiceSettingsUpdate'}
      responses:
        '200': {description: Persisted settings fact; provider health is not optimistically inferred, content: {application/json: {schema: {$ref: '#/components/schemas/AIServiceSettings'}}}}
        '400': {description: Invalid profile, scope, or budget}
        '401': {description: Administrator session required}
        '409': {description: Stale version or idempotency conflict}
  /api/v1/applications/{applicationId}/webhooks:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
    post:
      operationId: configureApplicationWebhook
      description: Stores a canonical HTTPS endpoint and opaque SecretReference only; no signing material is accepted or returned.
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookConfigurationRequest'}
      responses:
        '201':
          description: Endpoint configured. Delivery remains asynchronous and durable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookConfigurationResponse'}
        '400': {description: Unsafe URL, unsupported event type, or invalid opaque secret reference}
        '401': {description: Administrator session required}
        '503': {description: M4 webhook composition unavailable}
  /api/v1/applications/{applicationId}/logs:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
    get:
      operationId: queryApplicationLogs
      description: The normal projection is summarized; the administrator may query persisted redacted build/runtime/audit logs.
      parameters:
        - {name: category, in: query, schema: {type: string, enum: [build, runtime, audit]}}
        - {name: service, in: query, schema: {type: string}}
        - {name: release_id, in: query, schema: {type: string}}
        - {name: level, in: query, schema: {type: string, enum: [debug, info, warn, error]}}
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {name: until, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Summary or operator log query result}
        '400': {description: Invalid query}
        '503': {description: M4 log composition unavailable}
  /api/v1/applications/{applicationId}/webhooks/{webhookId}/test:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
      - {name: webhookId, in: path, required: true, schema: {type: string, minLength: 1}}
    post:
      operationId: testApplicationWebhook
      description: Queues a signed, redacted occurrence test through the durable ledger; it does not synchronously disclose secret material or receiver response bodies.
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '202':
          description: Test delivery reserved for the durable worker.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookTestResponse'}
        '400': {description: Invalid endpoint ID or request identity}
        '401': {description: Administrator session required}
        '404': {description: Webhook endpoint or default environment not found}
        '503': {description: M4 webhook composition unavailable}
  /api/v1/service-groups/{serviceGroupId}/releases:
    parameters:
      - $ref: '#/components/parameters/ServiceGroupID'
    post:
      operationId: createServiceGroupRelease
      description: >-
        Creates one immutable, digest-only ServiceGroup Release from a persisted SourceRevision.
        A prebuilt image that already contains a registry authority must use exactly the
        same authority as its supplied registry endpoint; authorities are never rewritten
        or redirected. Build, registry, Release, and runtime side effects are absent when
        this request is rejected.
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServiceGroupReleaseRequest'}
      responses:
        '201':
          description: Immutable Release persisted with a canonical digest.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceGroupReleaseResponse'}
        '400':
          description: >-
            Invalid source, immutable identity, registry endpoint, or mismatched prebuilt
            image authority. The response is structured and side-effect free.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APIError'}
        '403':
          description: Registry credential or provider boundary denied the request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APIError'}
        '409':
          description: Capacity or idempotency conflict.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APIError'}
        '503':
          description: Required provider is unavailable or timed out.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APIError'}
  /api/v1/events:
    parameters:
      - $ref: '#/components/parameters/APIVersion'
      - $ref: '#/components/parameters/APIMinVersion'
      - $ref: '#/components/parameters/APIMaxVersion'
    get:
      operationId: streamEvents
      description: >-
        Server-sent events stream with stable event IDs and a 24-hour persistent replay window.
        Clients reconnect with Last-Event-ID; the server replays events after that ID before
        continuing the live stream.
      parameters:
        - in: header
          name: Last-Event-ID
          schema:
            type: string
      responses:
        '200':
          description: Event stream
          headers:
            Open-Card-API-Version:
              $ref: '#/components/headers/APINegotiatedVersion'
          content:
            text/event-stream:
              schema:
                type: string
        '426':
          $ref: '#/components/responses/APIUpgradeRequired'
  /api/v1/operations/{operationId}/events:
    parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/APIVersion'
      - $ref: '#/components/parameters/APIMinVersion'
      - $ref: '#/components/parameters/APIMaxVersion'
    get:
      operationId: streamOperationEvents
      description: >-
        Server-sent events for one operation. Clients reconnect with Last-Event-ID and receive
        persistent replay after that ID before live events continue.
      parameters:
        - in: header
          name: Last-Event-ID
          schema:
            type: string
      responses:
        '200':
          description: Operation event stream
          headers:
            Open-Card-API-Version:
              $ref: '#/components/headers/APINegotiatedVersion'
          content:
            text/event-stream:
              schema:
                type: string
        '426':
          $ref: '#/components/responses/APIUpgradeRequired'
  /api/v1/access/ip-fallback:
    post:
      operationId: createIPFallback
      parameters: [{$ref: '#/components/parameters/RequiredIdempotencyKey'}, {$ref: '#/components/parameters/CSRFHeader'}, {$ref: '#/components/parameters/OriginHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IPFallbackRequest'}
      responses:
        '201':
          description: System-assigned IP and port fallback is available without claiming HTTPS.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessStateResponse'}
        '400': {description: Invalid or non-runtime-ready target}
        '403': {description: Service is not an explicit route target}
  /api/v1/access/platform-domains:
    post:
      operationId: bindPlatformDomain
      parameters: [{$ref: '#/components/parameters/RequiredIdempotencyKey'}, {$ref: '#/components/parameters/CSRFHeader'}, {$ref: '#/components/parameters/OriginHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [base_domain, dns_target]
              properties:
                base_domain: {type: string}
                dns_target: {type: string}
      responses:
        '201':
          description: Platform DNS and isolated wildcard certificate are verified.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DomainBindingResponse'}
        '409': {description: DNS or certificate verification failed; IP fallback remains available}
  /api/v1/access/application-domains:
    post:
      operationId: bindApplicationDomain
      parameters: [{$ref: '#/components/parameters/RequiredIdempotencyKey'}, {$ref: '#/components/parameters/CSRFHeader'}, {$ref: '#/components/parameters/OriginHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [application_id, host, cname_target]
              properties:
                application_id: {type: string}
                host: {type: string}
                cname_target: {type: string}
      responses:
        '201':
          description: CNAME and isolated application certificate are verified.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DomainBindingResponse'}
        '409': {description: CNAME or certificate failed; no route was enabled}
  /api/v1/access/domain-routes:
    post:
      operationId: applyDomainRoutes
      parameters: [{$ref: '#/components/parameters/RequiredIdempotencyKey'}, {$ref: '#/components/parameters/CSRFHeader'}, {$ref: '#/components/parameters/OriginHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DomainRoutesRequest'}
      responses:
        '201':
          description: Verified longest-prefix routes were atomically loaded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessStateResponse'}
        '403': {description: Worker or database target is not routable}
        '409': {description: Domain/path conflict or unverified domain/certificate}
  /api/v1/access/platform-application-domains:
    post:
      operationId: createPlatformApplicationDomain
      parameters: [{$ref: '#/components/parameters/RequiredIdempotencyKey'}, {$ref: '#/components/parameters/CSRFHeader'}, {$ref: '#/components/parameters/OriginHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [application_id, application_name, platform]
              properties:
                application_id: {type: string}
                application_name: {type: string}
                platform: {$ref: '#/components/schemas/DomainBinding'}
      responses:
        '201': {description: Stable slug plus short-ID platform hostname was created}
        '409': {description: Platform domain or wildcard certificate is not ready}
  /api/v1/access/certificates/renew:
    post:
      operationId: renewCertificate
      parameters: [{$ref: '#/components/parameters/RequiredIdempotencyKey'}, {$ref: '#/components/parameters/CSRFHeader'}, {$ref: '#/components/parameters/OriginHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [application_id, certificate]
              properties:
                application_id: {type: string}
                certificate: {$ref: '#/components/schemas/CertificateReference'}
      responses:
        '201': {description: Replacement certificate reference is ready}
        '503': {description: Renewal failed; current route and IP fallback remain active}
  /api/v1/access/traffic-switches:
    post:
      operationId: switchTraffic
      parameters: [{$ref: '#/components/parameters/RequiredIdempotencyKey'}, {$ref: '#/components/parameters/CSRFHeader'}, {$ref: '#/components/parameters/OriginHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [application_id, old, candidate, health_url, observation_url, window_ms]
              properties:
                application_id: {type: string}
                old: {type: array, minItems: 1, items: {$ref: '#/components/schemas/DesiredRoute'}}
                candidate: {type: array, minItems: 1, items: {$ref: '#/components/schemas/DesiredRoute'}}
                health_url: {type: string, description: Loopback HTTP URL only}
                observation_url: {type: string, description: Loopback HTTP URL only}
                window_ms: {type: integer, minimum: 0, maximum: 10000}
      responses:
        '202': {description: Candidate remained healthy through the observation window}
        '400': {description: Non-loopback probe or invalid request}
        '503': {description: Candidate failed; old routes remain serving}
  /api/v1/operations/views/{applicationId}:
    get:
      operationId: getApplicationOperationsView
      parameters:
        - $ref: '#/components/parameters/ApplicationID'
        - {name: environment_id, in: query, required: true, schema: {type: string}}
        - {name: mode, in: query, required: false, schema: {type: string, enum: [ordinary, operator], default: ordinary}}
      responses:
        '200':
          description: Both projections carry one control-plane fact version and observation time.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationsViewResponse'}
        '401': {description: Administrator session required}
        '503': {description: Stored operation facts are unavailable or invalid}
  /api/v1/operations/{action}:
    post:
      operationId: requestApplicationOperation
      parameters:
        - {name: action, in: path, required: true, schema: {type: string, enum: [restart, redeploy, rollback]}}
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OperationsActionRequest'}
      responses:
        '202':
          description: Typed operation completed through durable audit and outbox boundaries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationsActionResponse'}
        '400': {description: Invalid operation request}
        '401': {description: Administrator session required}
        '409': {description: Active operation, stale fact version, or idempotency conflict}
        '503': {description: Runtime operation failed; latest usable deployment remains the recovery target}
components:
  securitySchemes:
    AdministratorSession:
      type: apiKey
      in: cookie
      name: __Host-open_card_session
      description: >-
        Secure, HttpOnly, SameSite=Strict administrator session cookie. The server derives
        audit actor identity from the session; Open-Card-Role and Open-Card-Actor headers
        are never authorization inputs.
  parameters:
    APIVersion:
      name: Open-Card-API-Version
      in: header
      required: false
      description: >-
        Request an exact API version. This header is mutually exclusive with the minimum and
        maximum version range headers. If all version headers are omitted, API version 1.0 is
        negotiated for legacy clients.
      schema:
        type: string
        pattern: '^v?[0-9]+(\.[0-9]+)?$'
    APIMinVersion:
      name: Open-Card-API-Min-Version
      in: header
      required: false
      description: Lowest API version accepted by the client. Use with Open-Card-API-Max-Version.
      schema:
        type: string
        pattern: '^v?[0-9]+(\.[0-9]+)?$'
    APIMaxVersion:
      name: Open-Card-API-Max-Version
      in: header
      required: false
      description: Highest API version accepted by the client. Use with Open-Card-API-Min-Version.
      schema:
        type: string
        pattern: '^v?[0-9]+(\.[0-9]+)?$'
    ApplicationID:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
    DomainID:
      name: domainId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    UploadID:
      name: uploadId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    CSRFHeader:
      name: X-Open-Card-CSRF
      in: header
      required: true
      description: Double-submit CSRF value matching the non-HttpOnly administrator CSRF cookie.
      schema: {type: string, minLength: 1}
    OriginHeader:
      name: Origin
      in: header
      required: true
      description: Exact configured HTTPS administrator origin; cross-origin control-plane writes are rejected.
      schema: {type: string, format: uri}
    ServiceGroupID:
      name: serviceGroupId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Stable retry key. Reuse with different input is rejected.
      schema:
        type: string
        minLength: 1
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
  headers:
    APINegotiatedVersion:
      description: API version selected for this request and response.
      schema:
        type: string
        pattern: '^[0-9]+\.[0-9]+$'
  responses:
    APIUpgradeRequired:
      description: No common API version is available for the requested range.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
    AuthenticationRequired:
      description: Valid administrator session and, for writes, exact Origin plus CSRF proof are required. Rejections use the same 401 response.
      content: {application/json: {schema: {$ref: '#/components/schemas/APIError'}}}
    StateConflict:
      description: State, version or idempotency conflict.
      content: {application/json: {schema: {$ref: '#/components/schemas/APIError'}}}
    PayloadTooLarge:
      description: Upload exceeds the negotiated size, file-count or expanded-content limit.
      content: {application/json: {schema: {$ref: '#/components/schemas/APIError'}}}
    UnsupportedMediaType:
      description: Upload media type is unsupported.
      content: {application/json: {schema: {$ref: '#/components/schemas/APIError'}}}
    ValidationFailed:
      description: Input violates the API contract.
      content: {application/json: {schema: {$ref: '#/components/schemas/APIError'}}}
    RateLimited:
      description: Request is rate limited.
      content: {application/json: {schema: {$ref: '#/components/schemas/APIError'}}}
    DependencyUnavailable:
      description: Required local controller or dependency is unavailable.
      content: {application/json: {schema: {$ref: '#/components/schemas/APIError'}}}
    NotFound:
      description: Requested durable resource was not found.
      content: {application/json: {schema: {$ref: '#/components/schemas/APIError'}}}
  schemas:
    APIError:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
    AuthLoginRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
    AuthPasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
        new_password: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [authenticated, idle_expires_at, absolute_expires_at]
      properties:
        authenticated: {type: boolean, enum: [true]}
        idle_expires_at: {type: string, format: date-time}
        absolute_expires_at: {type: string, format: date-time}
    Application:
      type: object
      required: [id, name, created_at, updated_at, source, operation_id, runtime_ready, serving, runtime_status]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        source: {$ref: '#/components/schemas/ApplicationSource'}
        operation_id: {type: string, nullable: true, description: Latest durable publish operation only; null when the application has not been published.}
        publishing: {$ref: '#/components/schemas/ApplicationPublishing', nullable: true}
        runtime_ready: {type: boolean}
        serving: {type: boolean}
        runtime_status: {type: string, enum: [unknown, partial, running]}
    ApplicationSource:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {type: string, enum: [archive, folder, git, unknown]}
        source_upload_id: {type: string, nullable: true}
        locator: {type: string, nullable: true, description: Public Git HTTPS locator only; null for uploads or unknown legacy sources.}
        ref: {type: string, nullable: true}
    ApplicationPublishing:
      type: object
      additionalProperties: false
      required: [status, sequence, last_event_id, message, evidence_ids]
      properties:
        status: {type: string, enum: [preparing, building, deploying, succeeded, failed]}
        sequence: {type: integer, format: int64, minimum: 1}
        last_event_id: {type: string}
        message: {type: string}
        evidence_ids: {type: array, items: {type: string}}
    ApplicationPublishRequest:
      type: object
      additionalProperties: false
      required: [build_kind, context_path, service_name, container_port]
      properties:
        build_kind: {type: string, enum: [static, dockerfile]}
        context_path: {type: string}
        dockerfile_path: {type: string, nullable: true}
        service_name: {type: string}
        container_port: {type: integer, minimum: 1, maximum: 65535}
    ApplicationPublishResponse:
      type: object
      additionalProperties: false
      required: [status, operation_id, release_id, deployment_id, task_id, source_revision_id]
      properties:
        status: {type: string, enum: [deploying]}
        operation_id: {type: string}
        release_id: {type: string}
        deployment_id: {type: string}
        task_id: {type: string}
        source_revision_id: {type: string}
    ApplicationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Application'
    ApplicationDetail:
      type: object
      additionalProperties: false
      required: [id, name, created_at, updated_at, source, operation_id, runtime_ready, serving, runtime_status, source_upload_id, access]
      properties:
        id: {type: string}
        name: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        source: {$ref: '#/components/schemas/ApplicationSource'}
        operation_id: {type: string, nullable: true, description: Latest durable publish operation only; null when the application has not been published.}
        publishing: {$ref: '#/components/schemas/ApplicationPublishing', nullable: true}
        runtime_ready: {type: boolean}
        serving: {type: boolean}
        runtime_status: {type: string, enum: [unknown, partial, running]}
        source_upload_id: {type: string, nullable: true, description: Claimed source upload ID when the immutable source was created from a browser upload; null for Git or unknown legacy sources.}
        access: {$ref: '#/components/schemas/ApplicationAccessSummary'}
    DomainLifecycleStatus:
      type: string
      enum: [unconfigured, pending, verifying, certificate_pending, ready, failed]
    DomainVerification:
      type: object
      additionalProperties: false
      required: [method, status]
      properties:
        method: {type: string, enum: [dns_txt, cname, public_dns_read_only]}
        status: {$ref: '#/components/schemas/DomainLifecycleStatus'}
        name: {type: string, nullable: true}
        value: {type: string, nullable: true}
        observed_at: {type: string, format: date-time, nullable: true}
    CertificateStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [pending, issuing, ready, failed]}
        subject: {type: string, nullable: true}
        not_after: {type: string, format: date-time, nullable: true}
    FailureState:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        retryable: {type: boolean}
    PlatformDomainSettingsRequest:
      type: object
      additionalProperties: false
      required: [base_domain]
      properties:
        base_domain: {type: string, minLength: 1, description: Registrable platform base domain, not a customer root domain.}
    PlatformDomainSettingsResponse:
      type: object
      additionalProperties: false
      required: [status, base_domain, console_domain, wildcard_pattern, verification, certificate, failure, next_action]
      properties:
        status: {$ref: '#/components/schemas/DomainLifecycleStatus'}
        base_domain: {type: string, nullable: true}
        console_domain: {type: string, nullable: true}
        wildcard_pattern: {type: string, nullable: true, description: "*.apps.<base_domain> when configured."}
        verification: {$ref: '#/components/schemas/DomainVerification'}
        certificate: {$ref: '#/components/schemas/CertificateStatus'}
        failure: {$ref: '#/components/schemas/FailureState', nullable: true}
        next_action: {type: string, enum: [configure_base_domain, publish_verification_record, wait_for_verification, wait_for_certificate, ready, retry]}
    CustomDomainBindRequest:
      type: object
      additionalProperties: false
      required: [hostname]
      properties:
        hostname: {type: string, minLength: 1, description: Customer hostname only; client never supplies a CNAME target or DNS provider data.}
    ApplicationDomain:
      type: object
      additionalProperties: false
      required: [id, hostname, kind, status, cname_target, verification, certificate, failure, serving]
      properties:
        id: {type: string}
        hostname: {type: string}
        kind: {type: string, enum: [platform, custom]}
        status: {$ref: '#/components/schemas/DomainLifecycleStatus'}
        cname_target: {type: string, nullable: true}
        verification: {$ref: '#/components/schemas/DomainVerification'}
        certificate: {$ref: '#/components/schemas/CertificateStatus'}
        failure: {$ref: '#/components/schemas/FailureState', nullable: true}
        serving: {type: boolean}
    ApplicationDomainsResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ApplicationDomain'}}
    ApplicationDomainResponse:
      type: object
      additionalProperties: false
      required: [domain]
      properties:
        domain: {$ref: '#/components/schemas/ApplicationDomain'}
    AccessRouteStatus:
      type: object
      additionalProperties: false
      required: [desired, serving]
      properties:
        desired: {type: boolean}
        serving: {type: boolean}
        route_id: {type: string, nullable: true}
    ApplicationAccessSummary:
      type: object
      additionalProperties: false
      required: [runtimeReady, ipFallback, platformAddress, customDomains, route, certificate, serving]
      properties:
        runtimeReady: {type: boolean}
        ipFallback: {type: string, nullable: true}
        platformAddress: {$ref: '#/components/schemas/ApplicationDomain', nullable: true}
        customDomains: {type: array, items: {$ref: '#/components/schemas/ApplicationDomain'}}
        route: {$ref: '#/components/schemas/AccessRouteStatus'}
        certificate: {$ref: '#/components/schemas/CertificateStatus'}
        serving: {type: boolean}
    ApplicationAccessResponse:
      allOf:
        - $ref: '#/components/schemas/ApplicationAccessSummary'
    SourceUploadManifestEntry:
      type: object
      additionalProperties: false
      required: [path, bytes]
      properties:
        path: {type: string, pattern: '^(?!/)(?!.*//)(?!.*(?:^|/)\.(?:/|$))(?!.*(?:^|/)\.\.(?:/|$))(?!.*\/$)[A-Za-z0-9][A-Za-z0-9._/@+ -]*$', description: Normalized relative path with no empty, dot, parent or trailing-slash segment.}
        bytes: {type: integer, format: int64, minimum: 0}
        digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    SourceUploadManifest:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        files: {type: array, minItems: 1, items: {$ref: '#/components/schemas/SourceUploadManifestEntry'}}
    SourceUploadRequest:
      oneOf:
        - $ref: '#/components/schemas/SourceUploadArchiveRequest'
        - $ref: '#/components/schemas/SourceUploadDirectoryRequest'
      discriminator: {propertyName: mode}
    SourceUploadArchiveRequest:
      type: object
      additionalProperties: false
      required: [mode, archive]
      properties:
        mode: {type: string, enum: [archive]}
        archive: {type: string, format: binary, description: Required exactly once; accepted filename extensions are .zip, .tar.gz and .tgz only.}
    SourceUploadDirectoryRequest:
      type: object
      additionalProperties: false
      required: [mode, files, manifest]
      properties:
        mode: {type: string, enum: [directory]}
        files: {type: array, minItems: 1, items: {type: string, format: binary}, description: Required as repeated multipart parts. Each part filename is a normalized relative path cross-checked against manifest.files.}
        manifest: {$ref: '#/components/schemas/SourceUploadManifest'}
    SourceUploadResponse:
      type: object
      additionalProperties: false
      required: [id, kind, status, digest, bytes, file_count, expires_at]
      properties:
        id: {type: string}
        kind: {type: string, enum: [archive, directory]}
        status: {type: string, enum: [ready, claimed, expired, failed]}
        digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        bytes: {type: integer, format: int64, minimum: 0}
        file_count: {type: integer, minimum: 1}
        expires_at: {type: string, format: date-time}
    CreateApplicationResponse:
      type: object
      required: [application, environment_id, operation_id, source_revision_id]
      properties:
        application:
          $ref: '#/components/schemas/Application'
        environment_id:
          type: string
        operation_id:
          type: string
        source_revision_id:
          type: string
    CreateApplicationRequest:
      type: object
      required: [name, source]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        source:
          oneOf:
            - $ref: '#/components/schemas/CreateApplicationUploadSource'
            - $ref: '#/components/schemas/CreateApplicationGitSource'
          discriminator: {propertyName: kind}
    CreateApplicationUploadSource:
      type: object
      additionalProperties: false
      required: [kind, upload_id]
      properties:
        kind: {type: string, enum: [upload]}
        upload_id: {type: string, minLength: 1}
    CreateApplicationGitSource:
      type: object
      additionalProperties: false
      required: [kind, repository_url, ref]
      properties:
        kind: {type: string, enum: [git]}
        repository_url: {type: string, format: uri}
        ref: {type: string, minLength: 1}
    SystemStatus:
      type: object
      additionalProperties: false
      required: [version, node, platform_domain, webhooks, backup, alerts]
      properties:
        version: {type: string}
        node:
          type: object
          additionalProperties: false
          required: [single_node, instance_id, node_id, readiness]
          properties:
            single_node: {type: boolean, enum: [true]}
            instance_id: {type: string, nullable: true}
            node_id: {type: string, nullable: true}
            readiness: {type: string, enum: [ready, not_ready, unconfigured]}
        platform_domain:
          type: object
          additionalProperties: false
          required: [status, base_domain]
          properties:
            status: {type: string, enum: [unconfigured, pending, failed, ready]}
            base_domain: {type: string, nullable: true}
        webhooks:
          type: object
          additionalProperties: false
          required: [status, enabled_count]
          properties:
            status: {type: string, enum: [configured, unconfigured]}
            enabled_count: {type: integer, minimum: 0}
        backup:
          type: object
          additionalProperties: false
          required: [status]
          properties: {status: {type: string, enum: [not_installed]}}
        alerts:
          type: object
          additionalProperties: false
          required: [status]
          properties: {status: {type: string, enum: [not_installed]}}
    ServiceGroupRegistryInput:
      type: object
      additionalProperties: false
      required: [endpoint]
      properties:
        endpoint:
          type: string
          format: uri
          description: >-
            HTTPS registry endpoint, or a loopback-only HTTP fixture endpoint. For an
            already-qualified prebuilt image, its registry authority must exactly match.
        secret_ref:
          $ref: '#/components/schemas/OpaqueSecretReference'
    ServiceGroupReleaseRequest:
      type: object
      additionalProperties: false
      required: [source_revision_id, version]
      properties:
        source_revision_id: {type: string, minLength: 1}
        version: {type: integer, minimum: 1}
        registries:
          type: array
          maxItems: 1
          items: {$ref: '#/components/schemas/ServiceGroupRegistryInput'}
    ServiceGroupRelease:
      type: object
      additionalProperties: false
      required: [id, application_id, service_group_id, version, config_digest, service_digests, status, immutable, created_at]
      properties:
        id: {type: string}
        application_id: {type: string}
        service_group_id: {type: string}
        version: {type: integer, minimum: 1}
        config_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        service_digests:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [repository, digest]
            properties:
              repository: {type: string, minLength: 1}
              digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
              resolved_tag: {type: string}
        status: {type: string, enum: [ready]}
        immutable: {type: boolean, enum: [true]}
        created_at: {type: string, format: date-time}
    ServiceGroupReleaseResponse:
      type: object
      additionalProperties: false
      required: [release, canonical_digest]
      properties:
        release: {$ref: '#/components/schemas/ServiceGroupRelease'}
        canonical_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    RouteTarget:
      type: object
      additionalProperties: false
      required: [application_id, deployment_id, service_name, port, path, routable]
      properties:
        application_id: {type: string}
        deployment_id: {type: string}
        service_name: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535}
        path: {type: string, pattern: '^/'}
        routable: {type: boolean}
    RouteFact:
      type: object
      additionalProperties: false
      required: [id, application_id, deployment_id, service_name, host, path, verified, serving, created_at]
      properties:
        id: {type: string}
        application_id: {type: string}
        deployment_id: {type: string}
        service_name: {type: string}
        host: {type: string}
        path: {type: string}
        certificate_ref: {type: string}
        verified: {type: boolean}
        serving: {type: boolean}
        created_at: {type: string, format: date-time}
    DesiredRoute:
      type: object
      additionalProperties: false
      required: [route, port]
      properties:
        route: {$ref: '#/components/schemas/RouteFact'}
        port: {type: integer, minimum: 1, maximum: 65535}
    IPFallbackRequest:
      allOf:
        - {$ref: '#/components/schemas/RouteTarget'}
        - type: object
          required: [server_ip, runtime_ready]
          properties:
            server_ip: {type: string}
            runtime_ready: {type: boolean}
    DomainBinding:
      type: object
      additionalProperties: false
      required: [id, kind, host, status, created_at, updated_at]
      properties:
        id: {type: string}
        kind: {type: string, enum: [platform, application]}
        application_id: {type: string}
        platform_domain_id: {type: string}
        managed: {type: boolean}
        host: {type: string}
        expected_cname: {type: string}
        status: {type: string, enum: [pending, verifying, verified, certificate_pending, ready, failed]}
        certificate_ref: {type: string}
        failure_reason: {type: string}
        verified_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CertificateReference:
      type: object
      additionalProperties: false
      required: [id, domain_binding_id, host, secret_ref, status, updated_at]
      properties:
        id: {type: string}
        domain_binding_id: {type: string}
        host: {type: string}
        secret_ref:
          type: object
          description: Opaque reference only; private material is never returned.
        status: {type: string, enum: [pending, ready, renewing, failed]}
        fingerprint: {type: string}
        not_before: {type: string, format: date-time}
        not_after: {type: string, format: date-time}
        renew_after: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AccessState:
      type: object
      required: [runtime_ready, ip_available, https_ready, serving, serving_old_release, message]
      properties:
        application_id: {type: string}
        deployment_id: {type: string}
        runtime_ready: {type: boolean}
        ip_available: {type: boolean}
        ip_address: {type: string}
        domain_status: {type: string}
        domain: {type: string}
        https_ready: {type: boolean}
        serving: {type: boolean}
        serving_old_release: {type: boolean}
        message: {type: string}
    AccessStateResponse:
      type: object
      required: [access_state]
      properties:
        access_state: {$ref: '#/components/schemas/AccessState'}
    DomainBindingResponse:
      type: object
      required: [binding, certificate, access_state]
      properties:
        binding: {$ref: '#/components/schemas/DomainBinding'}
        certificate: {$ref: '#/components/schemas/CertificateReference'}
        access_state: {$ref: '#/components/schemas/AccessState'}
    DomainRoutesRequest:
      type: object
      additionalProperties: false
      required: [binding, certificate, targets, runtime_ready]
      properties:
        binding: {$ref: '#/components/schemas/DomainBinding'}
        certificate: {$ref: '#/components/schemas/CertificateReference'}
        targets:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/RouteTarget'}
