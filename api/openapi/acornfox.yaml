openapi: 3.0.3
info:
  title: AcornFox API
  version: 1.0.0
  description: Clean-install single-service delivery API. Runtime and response observations are facts, not health or public-reachability claims.
paths:
  /api/v1/acornfox/setup:
    get:
      operationId: getAcornFoxSetupState
      security: []
      x-acornfox-parity: integration_ui
      responses:
        '200': {description: Browser setup availability only; this does not expose administrator credentials., content: {application/json: {schema: {$ref: '#/components/schemas/SetupStateResponse'}}}}
        '503': {$ref: '#/components/responses/AuthenticationUnavailable'}
    post:
      operationId: initializeAcornFoxAdministrator
      security: []
      x-acornfox-parity: integration_ui
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SetupRequest'}}}}
      responses:
        '201': {description: Administrator was durably initialized from a single-use operator-provisioned setup token., content: {application/json: {schema: {$ref: '#/components/schemas/SetupResponse'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/AuthenticationUnavailable'}
  /api/v1/acornfox/auth/login:
    post:
      operationId: loginAcornFoxAdministrator
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuthLoginRequest'}}}}
      responses:
        '200': {description: Administrator session created, headers: {Set-Cookie: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/AuthSessionResponse'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '429': {$ref: '#/components/responses/AuthenticationFailed'}
        '503': {$ref: '#/components/responses/AuthenticationUnavailable'}
  /api/v1/acornfox/auth/logout:
    post:
      operationId: logoutAcornFoxAdministrator
      security: [{AdministratorSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Administrator session and CSRF cookies cleared.}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '503': {$ref: '#/components/responses/AuthenticationUnavailable'}
  /api/v1/acornfox/auth/session:
    get:
      operationId: getAcornFoxAdministratorSession
      security: [{AdministratorSession: []}]
      responses:
        '200': {description: Current administrator session, content: {application/json: {schema: {$ref: '#/components/schemas/AuthSessionResponse'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '503': {$ref: '#/components/responses/AuthenticationUnavailable'}
  /api/v1/acornfox/auth/password:
    post:
      operationId: rotateAcornFoxAdministratorPassword
      security: [{AdministratorSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuthPasswordRequest'}}}}
      responses:
        '204': {description: Password changed; current session and CSRF cookies cleared.}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '503': {$ref: '#/components/responses/AuthenticationUnavailable'}
  /api/v1/acornfox/host/metrics:
    get:
      operationId: getAcornFoxHostMetrics
      x-acornfox-parity: integration_cli
      security: [{AdministratorSession: []}]
      responses:
        '200': {description: Read-only host telemetry snapshot. Missing optional metric groups are not zero values., content: {application/json: {schema: {$ref: '#/components/schemas/HostMetricsResponse'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/assistant/sessions:
    get:
      operationId: listAcornFoxAssistantSessions
      x-acornfox-parity: assistant_ui_only
      security: [{AdministratorSession: []}]
      responses:
        '200': {description: Administrator-owned assistant sessions only., content: {application/json: {schema: {$ref: '#/components/schemas/AssistantSessionListResponse'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
    post:
      operationId: createAcornFoxAssistantSession
      x-acornfox-parity: assistant_ui_only
      security: [{AdministratorSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantSessionCreateRequest'}}}}
      responses:
        '201': {description: Assistant session created. This does not start an assistant run., content: {application/json: {schema: {$ref: '#/components/schemas/AssistantSession'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '429': {$ref: '#/components/responses/TemporarilyUnavailable'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/assistant/sessions/{sessionId}/runs:
    parameters: [{$ref: '#/components/parameters/AssistantSessionId'}]
    post:
      operationId: submitAcornFoxAssistantRun
      x-acornfox-parity: assistant_ui_only
      security: [{AdministratorSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantRunSubmitRequest'}}}}
      responses:
        '200': {description: Idempotent replay of the same accepted assistant run; no second run was submitted., content: {application/json: {schema: {$ref: '#/components/schemas/AssistantRunSubmitResponse'}}}}
        '202': {description: Assistant run accepted. Completion is represented only by later run events and does not verify an application operation., content: {application/json: {schema: {$ref: '#/components/schemas/AssistantRunSubmitResponse'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '429': {$ref: '#/components/responses/TemporarilyUnavailable'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/assistant/sessions/{sessionId}/events:
    parameters: [{$ref: '#/components/parameters/AssistantSessionId'}]
    get:
      operationId: getAcornFoxAssistantEvents
      x-acornfox-parity: assistant_ui_only
      security: [{AdministratorSession: []}]
      parameters: [{$ref: '#/components/parameters/AssistantAfter'}, {$ref: '#/components/parameters/LastEventID'}]
      responses:
        '200': {description: JSON event snapshot or a continuing SSE stream when Accept is text/event-stream., headers: {X-AcornFox-Assistant-Cursor-Status: {schema: {type: string, enum: [ok, slow_consumer, expired]}}}, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantEventSnapshot'}}, text/event-stream: {schema: {type: string}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Cursor expired. A JSON snapshot supplies the oldest and latest retained cursor for a bounded retry., content: {application/json: {schema: {$ref: '#/components/schemas/AssistantEventSnapshot'}}}}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/assistant/sessions/{sessionId}/abort:
    parameters: [{$ref: '#/components/parameters/AssistantSessionId'}]
    post:
      operationId: abortAcornFoxAssistantSessionRuns
      x-acornfox-parity: assistant_ui_only
      security: [{AdministratorSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '200': {description: Abort was requested for this session's active and queued runs only., content: {application/json: {schema: {$ref: '#/components/schemas/AssistantAbortResponse'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/assistant/sessions/{sessionId}/actions:
    parameters: [{$ref: '#/components/parameters/AssistantSessionId'}]
    get:
      operationId: listAcornFoxAssistantActions
      x-acornfox-parity: assistant_ui_only
      security: [{AdministratorSession: []}]
      responses:
        '200': {description: "Administrator-owned session-scoped action proposals. verified is action evidence only and does not claim application health or public reachability.", content: {application/json: {schema: {$ref: '#/components/schemas/AssistantActionListResponse'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/assistant/sessions/{sessionId}/actions/{proposalId}/decision:
    parameters: [{$ref: '#/components/parameters/AssistantSessionId'}, {$ref: '#/components/parameters/AssistantProposalId'}]
    post:
      operationId: decideAcornFoxAssistantAction
      x-acornfox-parity: assistant_ui_only
      security: [{AdministratorSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantActionDecisionRequest'}}}}
      responses:
        '200': {description: Proposal was rejected or was already terminal; no new action was accepted., content: {application/json: {schema: {$ref: '#/components/schemas/AssistantActionProposal'}}}}
        '202': {description: "Proposal action was accepted, is executing, or has an unknown execution acknowledgement. Completion remains separate action evidence.", content: {application/json: {schema: {$ref: '#/components/schemas/AssistantActionProposal'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/apps:
    get:
      operationId: listAcornFoxApps
      security: [{AdministratorSession: []}]
      responses:
        '200': {description: Application list, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationListResponse'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
    post:
      operationId: createAcornFoxApp
      security: [{AdministratorSession: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateApplicationRequest'}}}}
      responses:
        '201': {description: Application and immutable public-Git source accepted, content: {application/json: {schema: {$ref: '#/components/schemas/CreateApplicationResponse'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/apps/{applicationId}:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}]
    get:
      operationId: getAcornFoxApp
      security: [{AdministratorSession: []}]
      responses:
        '200': {description: Application, content: {application/json: {schema: {$ref: '#/components/schemas/Application'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/apps/{applicationId}/sources:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}]
    get:
      operationId: listAcornFoxSourceRevisions
      security: [{AdministratorSession: []}]
      parameters: [{$ref: '#/components/parameters/DiscoveryLimit'}, {$ref: '#/components/parameters/DiscoveryCursor'}]
      responses:
        '200': {description: Immutable public HTTPS Git source revisions only, content: {application/json: {schema: {$ref: '#/components/schemas/SourceRevisionList'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidDiscoveryQuery'}
        '503': {$ref: '#/components/responses/DiscoveryUnavailable'}
    post:
      operationId: updateAcornFoxSourceRevision
      x-acornfox-parity: integration_cli
      security: [{AdministratorSession: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SourceUpdateRequest'}}}}
      responses:
        '201': {description: A new immutable source revision was imported; no build deployment or route changed., content: {application/json: {schema: {$ref: '#/components/schemas/SourceUpdateResponse'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/apps/{applicationId}/operations/{operationId}:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/OperationId'}]
    get:
      operationId: getAcornFoxOperationResult
      x-acornfox-parity: integration_cli
      security: [{AdministratorSession: []}]
      responses:
        '200': {description: "Read-only application-scoped operation evidence. Verified means task-scoped evidence was persisted and does not claim application health or public reachability.", content: {application/json: {schema: {$ref: '#/components/schemas/OperationResultResponse'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/apps/{applicationId}/sources/{sourceRevisionId}:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/SourceRevisionId'}]
    get:
      operationId: getAcornFoxSourceRevision
      security: [{AdministratorSession: []}]
      responses:
        '200': {description: Redacted immutable input revision, content: {application/json: {schema: {$ref: '#/components/schemas/SourceRevision'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/apps/{applicationId}/sources/{sourceRevisionId}/metadata:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/SourceRevisionId'}]
    get:
      operationId: getAcornFoxSourceMetadata
      x-acornfox-parity: integration_cli
      security: [{AdministratorSession: []}]
      responses:
        '200': {description: Public-source projection only. repository_url is absent unless public source provenance was explicitly proven., content: {application/json: {schema: {$ref: '#/components/schemas/SourceMetadataResponse'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/apps/{applicationId}/sources/{sourceRevisionId}/deployment-plan:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/SourceRevisionId'}]
    get:
      operationId: getAcornFoxDeploymentPlan
      x-acornfox-parity: integration_cli
      security: [{AdministratorSession: []}]
      responses:
        '200': {description: "Read-only deployment plan derived from the immutable source and its root Dockerfile. It does not build, deploy, or mutate the source.", content: {application/json: {schema: {$ref: '#/components/schemas/DeploymentPlan'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/apps/{applicationId}/fix-candidates:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}]
    get:
      operationId: listAcornFoxFixCandidates
      x-acornfox-parity: candidate_cli
      security: [{AdministratorSession: []}]
      responses:
        '200': {description: Latest 50 owner-scoped candidate lifecycle facts., content: {application/json: {schema: {$ref: '#/components/schemas/FixCandidateList'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
    post:
      operationId: createAcornFoxFixCandidate
      x-acornfox-parity: cli_only
      security: [{AdministratorSession: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FixCandidateRequest'}}}}
      responses:
        '202': {description: Candidate work was durably accepted; poll the returned candidate identity., content: {application/json: {schema: {$ref: '#/components/schemas/FixCandidate'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/apps/{applicationId}/fix-candidates/{candidateId}:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/CandidateId'}]
    get:
      operationId: getAcornFoxFixCandidate
      x-acornfox-parity: candidate_cli
      security: [{AdministratorSession: []}]
      responses:
        '200': {description: Owner-scoped canonical diff and isolated validation evidence., content: {application/json: {schema: {$ref: '#/components/schemas/FixCandidate'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/apps/{applicationId}/fix-candidates/{candidateId}/source-match:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/CandidateId'}]
    post:
      operationId: matchAcornFoxFixCandidateSource
      x-acornfox-parity: candidate_cli
      security: [{AdministratorSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FixCandidateSourceMatchRequest'}}}}
      responses:
        '200': {description: W05 imported source repository and tree match the candidate., content: {application/json: {schema: {$ref: '#/components/schemas/FixCandidate'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/apps/{applicationId}/fix-candidates/{candidateId}/publish:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/CandidateId'}]
    post:
      operationId: publishAcornFoxFixCandidate
      x-acornfox-parity: candidate_cli
      security: [{AdministratorSession: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '202': {description: Matching W05 source entered normal delivery after release-time OCI digest equality., content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryCommandResponse'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/apps/{applicationId}/deliveries:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}]
    get:
      operationId: listAcornFoxDeliveries
      security: [{AdministratorSession: []}]
      parameters: [{$ref: '#/components/parameters/DiscoveryLimit'}, {$ref: '#/components/parameters/DiscoveryCursor'}]
      responses:
        '200': {description: Strict AcornFox runtime-task-backed deployments only, content: {application/json: {schema: {$ref: '#/components/schemas/DeploymentRuntimeStateList'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidDiscoveryQuery'}
        '503': {$ref: '#/components/responses/DiscoveryUnavailable'}
    post:
      operationId: createAcornFoxDelivery
      security: [{AdministratorSession: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateDeliveryRequest'}}}}
      responses:
        '202': {description: Delivery work accepted; later facts determine outcome, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryCommandResponse'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/apps/{applicationId}/deliveries/{deploymentId}:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/DeploymentId'}]
    get:
      operationId: getAcornFoxDeliveryStatus
      security: [{AdministratorSession: []}]
      responses:
        '200': {description: Desired runtime and response facts; null means no fact was persisted, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryStatusResponse'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/apps/{applicationId}/deliveries/{deploymentId}/source:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/DeploymentId'}]
    get:
      operationId: getAcornFoxDeliverySource
      x-acornfox-parity: integration_cli
      security: [{AdministratorSession: []}]
      responses:
        '200': {description: Source proven for this exact deployment release. Fields are absent when release source history is unavailable., content: {application/json: {schema: {$ref: '#/components/schemas/DeliverySourceResponse'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/apps/{applicationId}/deliveries/{deploymentId}/restart:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/DeploymentId'}]
    post:
      operationId: restartAcornFoxDelivery
      security: [{AdministratorSession: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/EmptyRequest'}}}}
      responses:
        '202': {description: Restart work accepted, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryCommandResponse'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/apps/{applicationId}/deliveries/{deploymentId}/redeploy:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/DeploymentId'}]
    post:
      operationId: redeployAcornFoxDelivery
      security: [{AdministratorSession: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/EmptyRequest'}}}}
      responses:
        '202': {description: Recreate work accepted, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryCommandResponse'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/apps/{applicationId}/deliveries/{deploymentId}/logs:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/DeploymentId'}]
    get:
      operationId: listAcornFoxDeliveryLogs
      security: [{AdministratorSession: []}]
      parameters: [{$ref: '#/components/parameters/LogSource'}, {$ref: '#/components/parameters/LogLimit'}, {$ref: '#/components/parameters/LogCursor'}]
      responses:
        '200': {description: Already-collected build or runtime records. This read does not start collection or make runtime calls., content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryLogsResponse'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidLogQuery'}
        '503': {$ref: '#/components/responses/LogsUnavailable'}
  /api/v1/acornfox/apps/{applicationId}/deliveries/{deploymentId}/public-access:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/DeploymentId'}]
    get:
      operationId: getAcornFoxDeliveryPublicAccess
      security: [{AdministratorSession: []}]
      responses:
        '200': {description: Local public-access intent only. This state does not claim DNS TLS or Internet reachability., content: {application/json: {schema: {$ref: '#/components/schemas/PublicAccessResponse'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/PublicAccessUnavailable'}
    put:
      operationId: setAcornFoxDeliveryPublicAccess
      security: [{AdministratorSession: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PublicAccessRequest'}}}}
      responses:
        '200': {description: Local route intent updated. An enabled result remains pending external validation., content: {application/json: {schema: {$ref: '#/components/schemas/PublicAccessResponse'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/PublicAccessConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/PublicAccessUnavailable'}
  /api/v1/acornfox/apps/{applicationId}/deliveries/{deploymentId}/access-observation:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/DeploymentId'}]
    get:
      operationId: getAcornFoxExternalAccessObservation
      x-acornfox-parity: integration_cli
      security: [{AdministratorSession: []}]
      responses:
        '200': {description: Latest bounded administrator-client observation. available reports only this observation; it does not prove current public reachability., content: {application/json: {schema: {$ref: '#/components/schemas/ExternalAccessObservationReadResponse'}}}}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
    post:
      operationId: reportAcornFoxExternalAccessObservation
      x-acornfox-parity: cli_only
      security: [{AdministratorSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExternalAccessObservationReportRequest'}}}}
      responses:
        '200': {description: Exact report_id replay; no second observation was stored., content: {application/json: {schema: {$ref: '#/components/schemas/ExternalAccessObservation'}}}}
        '201': {description: New administrator-client external-access observation stored., content: {application/json: {schema: {$ref: '#/components/schemas/ExternalAccessObservation'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /api/v1/acornfox/apps/{applicationId}/deliveries/{deploymentId}/probes:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/DeploymentId'}]
    post:
      operationId: probeAcornFoxDeliveryOnce
      security: [{AdministratorSession: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProbeDeliveryRequest'}}}}
      responses:
        '202': {description: One caller-requested loopback response probe accepted, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryCommandResponse'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
components:
  securitySchemes:
    AdministratorSession:
      type: apiKey
      in: cookie
      name: __Host-acornfox_session
      description: Secure HttpOnly SameSite=Strict administrator session cookie.
  parameters:
    ApplicationId: {name: applicationId, in: path, required: true, schema: {type: string, minLength: 1}}
    SourceRevisionId: {name: sourceRevisionId, in: path, required: true, schema: {type: string, minLength: 1}}
    CandidateId: {name: candidateId, in: path, required: true, schema: {type: string, pattern: '^candidate_[0-9a-f]{32}$'}}
    OperationId: {name: operationId, in: path, required: true, schema: {type: string, minLength: 1}}
    AssistantSessionId: {name: sessionId, in: path, required: true, schema: {type: string, minLength: 1}}
    AssistantProposalId: {name: proposalId, in: path, required: true, schema: {type: string, minLength: 1}}
    AssistantAfter: {name: after, in: query, required: false, schema: {type: integer, minimum: 0}}
    LastEventID: {name: Last-Event-ID, in: header, required: false, schema: {type: string, pattern: '^[0-9]+$'}}
    DeploymentId: {name: deploymentId, in: path, required: true, schema: {type: string, minLength: 1}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1}}
    LogSource: {name: source, in: query, required: true, schema: {type: string, enum: [build, runtime]}}
    LogLimit: {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    LogCursor: {name: cursor, in: query, required: false, schema: {type: string, minLength: 1}, description: Opaque base64url cursor bound to this application deployment and source.}
    DiscoveryLimit: {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    DiscoveryCursor: {name: cursor, in: query, required: false, schema: {type: string, minLength: 1}, description: Opaque versioned cursor bound to the application and list resource.}
    CSRFToken:
      name: X-AcornFox-CSRF
      in: header
      required: true
      schema: {type: string, minLength: 1}
      description: Must equal the non-HttpOnly CSRF cookie (__Host-acornfox_csrf under public HTTPS or acornfox_local_csrf under local loopback) and use the allowed Origin.
  responses:
    InvalidRequest: {description: Request JSON content type or body shape is invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    AuthenticationFailed: {description: Authentication origin CSRF or session validation failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    AuthenticationUnavailable: {description: Authentication persistence is temporarily unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Resource or exact route was not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    IdempotencyConflict: {description: Idempotency key conflicts with prior input or accepted work, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ValidationFailed: {description: Request is syntactically valid but violates an AcornFox boundary, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    TemporarilyUnavailable: {description: Capability dependency or persisted readback is temporarily unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    InvalidLogQuery: {description: Log source limit or opaque cursor is invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    InvalidDiscoveryQuery: {description: Discovery list limit or opaque cursor is invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    DiscoveryUnavailable: {description: Discovery evidence is unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    LogsUnavailable: {description: Collected log storage or its integrity reconciliation is temporarily unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    PublicAccessConflict: {description: A local endpoint route ownership or idempotency conflict prevented the requested public-access intent, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    PublicAccessUnavailable: {description: The optional local public-access capability is unavailable or has no configured authorized root and route provider, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties: {code: {type: string}, message: {type: string}}
    AuthLoginRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties: {password: {type: string, minLength: 1}}
    AuthPasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties: {current_password: {type: string, minLength: 1}, new_password: {type: string, minLength: 1}}
    SetupStateResponse:
      type: object
      required: [state]
      additionalProperties: false
      properties: {state: {type: string, enum: [initialized, uninitialized, unavailable]}}
    SetupRequest:
      type: object
      required: [setup_token, password]
      additionalProperties: false
      properties: {setup_token: {type: string, minLength: 1, maxLength: 4096}, password: {type: string, minLength: 1, maxLength: 4096}}
    SetupResponse:
      type: object
      required: [initialized]
      additionalProperties: false
      properties: {initialized: {type: boolean, enum: [true]}}
    AssistantScope:
      type: object
      required: [kind]
      additionalProperties: false
      properties: {kind: {type: string, enum: [host, app]}, app_id: {type: string}}
    AssistantSession:
      type: object
      required: [session_id, scope, created_at, updated_at]
      additionalProperties: false
      properties: {session_id: {type: string}, scope: {$ref: '#/components/schemas/AssistantScope'}, created_at: {type: string, format: date-time}, updated_at: {type: string, format: date-time}}
    AssistantSessionListResponse:
      type: object
      required: [sessions]
      additionalProperties: false
      properties: {sessions: {type: array, items: {$ref: '#/components/schemas/AssistantSession'}}}
    AssistantSessionCreateRequest:
      type: object
      required: [scope]
      additionalProperties: false
      properties: {scope: {$ref: '#/components/schemas/AssistantScope'}}
    AssistantRun:
      type: object
      required: [run_id, session_id, status, created_at, updated_at]
      additionalProperties: false
      properties: {run_id: {type: string}, session_id: {type: string}, status: {type: string, enum: [accepted, running, completed, failed, aborted, unknown]}, created_at: {type: string, format: date-time}, updated_at: {type: string, format: date-time}}
    AssistantRunSubmitRequest:
      type: object
      required: [idempotency_key, message]
      additionalProperties: false
      properties: {idempotency_key: {type: string, minLength: 1, maxLength: 128}, message: {type: string, minLength: 1, maxLength: 65536}}
    AssistantRunSubmitResponse:
      type: object
      required: [run, replay]
      additionalProperties: false
      properties: {run: {$ref: '#/components/schemas/AssistantRun'}, replay: {type: boolean}}
    AssistantEvent:
      type: object
      required: [cursor, type, occurred_at]
      additionalProperties: false
      properties: {cursor: {type: integer, minimum: 1}, run_id: {type: string}, type: {type: string, enum: [run.accepted, run.started, assistant.delta, assistant.message, run.completed, run.failed, run.aborted, run.unknown]}, occurred_at: {type: string, format: date-time}, text: {type: string, maxLength: 65536}}
    AssistantEventSnapshot:
      type: object
      required: [status, oldest_cursor, latest_cursor, events]
      additionalProperties: false
      properties: {status: {type: string, enum: [ok, slow_consumer, expired]}, oldest_cursor: {type: integer, minimum: 0}, latest_cursor: {type: integer, minimum: 0}, events: {type: array, items: {$ref: '#/components/schemas/AssistantEvent'}}}
    AssistantAbortResponse:
      type: object
      required: [aborted]
      additionalProperties: false
      properties: {aborted: {type: integer, minimum: 0}}
    AssistantActionTarget:
      type: object
      required: [application_id, deployment_id, target_release_id, target_release_version, application_name]
      additionalProperties: false
      properties: {application_id: {type: string}, deployment_id: {type: string}, target_release_id: {type: string}, target_release_version: {type: integer, format: int64, minimum: 1}, application_name: {type: string, maxLength: 128}}
    AssistantActionVerification:
      type: object
      required: [state]
      additionalProperties: false
      properties: {state: {type: string, enum: [pending, verified, failed]}, verdict: {type: string, maxLength: 256}, observed_at: {type: string, format: date-time}}
    AssistantActionProposal:
      type: object
      required: [proposal_id, session_id, run_id, action, target, state, expires_at, verification, created_at, updated_at]
      additionalProperties: false
      properties: {proposal_id: {type: string}, session_id: {type: string}, run_id: {type: string}, action: {type: string, enum: [restart, redeploy]}, target: {$ref: '#/components/schemas/AssistantActionTarget'}, state: {type: string, enum: [pending, rejected, expired, executing, accepted, unknown, verified, failed]}, expires_at: {type: string, format: date-time}, operation_id: {type: string}, verification: {$ref: '#/components/schemas/AssistantActionVerification'}, created_at: {type: string, format: date-time}, updated_at: {type: string, format: date-time}}
    AssistantActionListResponse:
      type: object
      required: [actions]
      additionalProperties: false
      properties: {actions: {type: array, items: {$ref: '#/components/schemas/AssistantActionProposal'}}}
    AssistantActionDecisionRequest:
      type: object
      required: [approve]
      additionalProperties: false
      properties: {approve: {type: boolean}}
    AuthSessionResponse:
      type: object
      required: [authenticated, idle_expires_at, absolute_expires_at]
      additionalProperties: false
      properties: {authenticated: {type: boolean}, idle_expires_at: {type: string, format: date-time}, absolute_expires_at: {type: string, format: date-time}}
    Application:
      type: object
      required: [id, name, created_at, updated_at]
      additionalProperties: false
      properties: {id: {type: string}, name: {type: string}, created_at: {type: string, format: date-time}, updated_at: {type: string, format: date-time}}
    ApplicationListResponse:
      type: object
      required: [items]
      additionalProperties: false
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Application'}}}
    CreateApplicationRequest:
      type: object
      required: [name, source]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1}
        source:
          type: object
          required: [type, repository_url, ref]
          additionalProperties: false
          properties: {type: {type: string, enum: [public_git]}, repository_url: {type: string, format: uri}, ref: {type: string}}
    CreateApplicationResponse:
      type: object
      required: [application, source_revision_id, operation_id]
      additionalProperties: false
      properties: {application: {$ref: '#/components/schemas/Application'}, source_revision_id: {type: string}, operation_id: {type: string}}
    SourceRevision:
      type: object
      required: [id, application_id, kind, locator_sha256, content_digest, created_at, immutable]
      additionalProperties: false
      properties: {id: {type: string}, application_id: {type: string}, kind: {type: string, enum: [git_https]}, locator_sha256: {type: string}, ref: {type: string}, commit: {type: string}, content_digest: {type: string}, created_at: {type: string, format: date-time}, immutable: {type: boolean}}
    SourceMetadataResponse:
      type: object
      required: [source_revision_id, availability]
      additionalProperties: false
      properties: {source_revision_id: {type: string}, availability: {type: string, enum: [available, unavailable]}, repository_url: {type: string, format: uri}}
    DeploymentPlanDockerfile:
      type: object
      required: [status, path, stage_count]
      additionalProperties: false
      properties:
        status: {type: string, enum: [ready, waiting_later, unsupported]}
        path: {type: string}
        digest: {type: string}
        stage_count: {type: integer, minimum: 0}
        final_stage: {type: object, additionalProperties: true}
        workdir: {type: string}
        entrypoint: {type: object, additionalProperties: true}
        command: {type: object, additionalProperties: true}
    DeploymentPlanPort:
      type: object
      required: [port, protocol, source]
      additionalProperties: false
      properties: {port: {type: integer, minimum: 1, maximum: 65535}, protocol: {type: string, enum: [tcp, udp]}, source: {type: string, enum: [dockerfile_expose]}}
    DeploymentPlanPortSelection:
      type: object
      required: [status, reason, candidates]
      additionalProperties: false
      properties:
        status: {type: string, enum: [selected, required, unavailable]}
        reason: {type: string}
        selected_port: {type: integer, minimum: 1, maximum: 65535}
        candidates: {type: array, uniqueItems: true, items: {type: integer, minimum: 1, maximum: 65535}}
        suggested_ports: {type: array, uniqueItems: true, items: {type: integer, minimum: 1, maximum: 65535}}
    DeploymentPlanEnvironment:
      type: object
      required: [name]
      additionalProperties: false
      properties: {name: {type: string}, value: {type: string}, redacted: {type: boolean}}
    DeploymentPlanHealthcheck:
      type: object
      additionalProperties: false
      properties:
        present: {type: boolean}
        disabled: {type: boolean}
        form: {type: string, enum: [exec, shell]}
        test: {type: array, items: {type: string}}
        interval_seconds: {type: integer}
        timeout_seconds: {type: integer}
        start_period_seconds: {type: integer}
        retries: {type: integer}
    DeploymentPlan:
      type: object
      required: [application_id, source_revision_id, repository_url, ref, commit, dockerfile, ports, port_selection, healthcheck, environment, gaps, warnings, required_actions, ready_to_deploy]
      additionalProperties: false
      properties:
        application_id: {type: string}
        source_revision_id: {type: string}
        repository_url: {type: string, format: uri}
        ref: {type: string}
        commit: {type: string}
        dockerfile: {$ref: '#/components/schemas/DeploymentPlanDockerfile'}
        ports: {type: array, items: {$ref: '#/components/schemas/DeploymentPlanPort'}}
        port_selection: {$ref: '#/components/schemas/DeploymentPlanPortSelection'}
        healthcheck: {$ref: '#/components/schemas/DeploymentPlanHealthcheck'}
        environment: {type: array, items: {$ref: '#/components/schemas/DeploymentPlanEnvironment'}}
        gaps: {type: array, items: {type: string}}
        warnings: {type: array, items: {type: string}}
        required_actions: {type: array, items: {type: string}}
        ready_to_deploy: {type: boolean}
    SourceRevisionList:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties: {items: {type: array, items: {$ref: '#/components/schemas/SourceRevision'}}, next_cursor: {type: string, nullable: true}}
    SourceUpdateRequest:
      type: object
      required: [base_source_revision_id, ref]
      additionalProperties: false
      properties: {base_source_revision_id: {type: string, minLength: 1}, ref: {type: string, minLength: 1}}
    SourceUpdateResponse:
      type: object
      required: [source_revision_id, status]
      additionalProperties: false
      properties: {source_revision_id: {type: string}, status: {type: string, enum: [imported]}}
    FixCandidateRequest:
      type: object
      required: [base_source_revision_id, paths, unified_diff, container_port]
      additionalProperties: false
      properties:
        base_source_revision_id: {type: string, minLength: 1}
        paths: {type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: {type: string, minLength: 1}}
        unified_diff: {type: string, minLength: 1, maxLength: 131072}
        container_port: {type: integer, minimum: 1, maximum: 65535}
    FixCandidateSourceMatchRequest:
      type: object
      required: [source_revision_id]
      additionalProperties: false
      properties: {source_revision_id: {type: string, minLength: 1}}
    FixCandidateRuntimeEvidence:
      type: object
      required: [task_id, image, runtime_state, probe_outcome, cleanup_confirmed, evidence_digest]
      additionalProperties: false
      properties:
        task_id: {type: string}
        image: {$ref: '#/components/schemas/ImageDigest'}
        runtime_state: {type: string, enum: [stopped]}
        probe_outcome: {type: string, enum: [responded]}
        http_status: {type: integer, minimum: 100, maximum: 599}
        cleanup_confirmed: {type: boolean, enum: [true]}
        evidence_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    FixCandidateLifecycle:
      type: object
      required: [candidate_id, application_id, base_source_revision_id, status, created_at]
      additionalProperties: false
      properties:
        candidate_id: {type: string, pattern: '^candidate_[0-9a-f]{32}$'}
        application_id: {type: string}
        base_source_revision_id: {type: string}
        status: {type: string, enum: [preparing, failed]}
        created_at: {type: string, format: date-time}
    FixCandidateValidated:
      type: object
      required: [candidate_id, application_id, base_source_revision_id, base_repository_url, base_commit, base_tree_digest, patch_digest, result_tree_digest, container_port, changed_paths, canonical_diff, validated_image, build_log_ref, build_evidence_digest, runtime, status, created_at, expires_at]
      additionalProperties: false
      properties:
        candidate_id: {type: string, pattern: '^candidate_[0-9a-f]{32}$'}
        application_id: {type: string}
        base_source_revision_id: {type: string}
        base_repository_url: {type: string, format: uri}
        base_commit: {type: string, pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'}
        base_tree_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        patch_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        result_tree_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        container_port: {type: integer, minimum: 1, maximum: 65535}
        changed_paths: {type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: {type: string}}
        canonical_diff: {type: string, minLength: 1, maxLength: 131072}
        validated_image: {$ref: '#/components/schemas/ImageDigest'}
        build_log_ref: {type: string}
        build_evidence_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        runtime: {$ref: '#/components/schemas/FixCandidateRuntimeEvidence'}
        matched_source_revision_id: {type: string}
        matched_commit: {type: string, pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'}
        status: {type: string, enum: [validated, source_matched]}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    FixCandidate:
      oneOf:
        - {$ref: '#/components/schemas/FixCandidateLifecycle'}
        - {$ref: '#/components/schemas/FixCandidateValidated'}
    FixCandidateList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/FixCandidate'}}
    OperationEvidence:
      type: object
      required: [kind, verdict, observed_at]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [runtime_observation, response_observation]}
        verdict: {type: string, enum: [observed, unhealthy]}
        observed_at: {type: string, format: date-time}
        http_status: {type: integer, minimum: 100, maximum: 599}
    OperationResultResponse:
      type: object
      required: [operation_id, operation_type, status, accepted_at, updated_at]
      additionalProperties: false
      properties:
        operation_id: {type: string}
        operation_type: {type: string}
        status: {type: string, enum: [accepted, running, verified, failed, unknown]}
        task_id: {type: string}
        deployment_id: {type: string}
        accepted_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        evidence: {$ref: '#/components/schemas/OperationEvidence'}
    CreateDeliveryRequest:
      type: object
      required: [source_revision_id]
      additionalProperties: false
      properties: {source_revision_id: {type: string, minLength: 1}, container_port: {type: integer, minimum: 0, maximum: 65535}}
    EmptyRequest: {type: object, additionalProperties: false, maxProperties: 0}
    DeliveryCommandResponse:
      type: object
      required: [deployment_id, operation_id, task_id, status]
      additionalProperties: false
      properties: {deployment_id: {type: string}, operation_id: {type: string}, task_id: {type: string}, status: {type: string}}
    ImageDigest:
      type: object
      required: [repository, digest]
      additionalProperties: false
      properties: {repository: {type: string}, digest: {type: string}}
    RuntimeRequestedResources:
      type: object
      required: [cpu_millis, memory_bytes, pids, disk_reservation_bytes]
      additionalProperties: false
      properties: {cpu_millis: {type: integer, format: int64}, memory_bytes: {type: integer, format: int64}, pids: {type: integer, format: int64}, disk_reservation_bytes: {type: integer, format: int64}}
    RuntimeReleaseFact:
      type: object
      required: [application_id, environment_id, release_id, service_name, image, resources, accepted_at, immutable]
      additionalProperties: false
      properties: {application_id: {type: string}, environment_id: {type: string}, release_id: {type: string}, service_name: {type: string}, image: {$ref: '#/components/schemas/ImageDigest'}, resources: {$ref: '#/components/schemas/RuntimeRequestedResources'}, container_port: {type: integer}, accepted_at: {type: string, format: date-time}, immutable: {type: boolean}}
    RuntimeAppliedLimits:
      type: object
      required: [cpu_millis, memory_bytes, pids]
      additionalProperties: false
      properties: {cpu_millis: {type: integer, format: int64}, memory_bytes: {type: integer, format: int64}, pids: {type: integer, format: int64}}
    RuntimeDiskFact:
      type: object
      required: [reservation_bytes, accounting_reconciled, per_container_enforced]
      additionalProperties: false
      properties: {reservation_bytes: {type: integer, format: int64}, accounting_reconciled: {type: boolean}, per_container_enforced: {type: boolean}}
    RuntimeObservation:
      type: object
      required: [deployment_id, service_name, runtime_state, restart_count, requested_resources, applied_limits, disk, observed_at]
      additionalProperties: false
      properties: {deployment_id: {type: string}, service_name: {type: string}, container_id: {type: string}, runtime_state: {type: string}, restart_count: {type: integer, format: int64}, internal_address: {type: string}, requested_resources: {$ref: '#/components/schemas/RuntimeRequestedResources'}, applied_limits: {$ref: '#/components/schemas/RuntimeAppliedLimits'}, disk: {$ref: '#/components/schemas/RuntimeDiskFact'}, observed_at: {type: string, format: date-time}}
    DeliveryStatusResponse:
      type: object
      required: [deployment, desired, runtime, response]
      additionalProperties: false
      properties:
        deployment: {$ref: '#/components/schemas/DeploymentRuntimeState'}
        desired:
          type: object
          nullable: true
          allOf:
            - {$ref: '#/components/schemas/RuntimeReleaseFact'}
        runtime:
          type: object
          nullable: true
          allOf:
            - {$ref: '#/components/schemas/RuntimeObservation'}
        response:
          type: object
          nullable: true
          allOf:
            - {$ref: '#/components/schemas/ProbeResponseFact'}
    DeploymentRuntimeState:
      type: object
      required: [id, application_id, environment_id, release_id, stage, created_at, updated_at]
      additionalProperties: false
      properties: {id: {type: string}, application_id: {type: string}, environment_id: {type: string}, release_id: {type: string}, stage: {type: string, enum: [starting, runtime_observed, failed, unknown]}, created_at: {type: string, format: date-time}, updated_at: {type: string, format: date-time}}
    DeploymentRuntimeStateList:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties: {items: {type: array, items: {$ref: '#/components/schemas/DeploymentRuntimeState'}}, next_cursor: {type: string, nullable: true}}
    DeliverySourceResponse:
      type: object
      required: [deployment_id, availability]
      additionalProperties: false
      properties: {deployment_id: {type: string}, availability: {type: string, enum: [available, unavailable]}, source_revision_id: {type: string}, commit: {type: string}, ref: {type: string}, repository_url: {type: string, format: uri}}
    HostMetricsCPU:
      type: object
      required: [logical_cores]
      additionalProperties: false
      properties: {logical_cores: {type: integer, minimum: 1}, usage_percent: {type: number, minimum: 0, maximum: 100}}
    HostMetricsMemory:
      type: object
      required: [total_bytes, available_bytes, used_bytes]
      additionalProperties: false
      properties: {total_bytes: {type: integer, format: int64, minimum: 0}, available_bytes: {type: integer, format: int64, minimum: 0}, used_bytes: {type: integer, format: int64, minimum: 0}}
    HostMetricsDisk:
      type: object
      required: [mountpoint, total_bytes, free_bytes, used_bytes]
      additionalProperties: false
      properties: {mountpoint: {type: string, enum: ['/']}, total_bytes: {type: integer, format: int64, minimum: 0}, free_bytes: {type: integer, format: int64, minimum: 0}, used_bytes: {type: integer, format: int64, minimum: 0}}
    HostMetricsNetwork:
      type: object
      required: [interface]
      additionalProperties: false
      properties: {interface: {type: string, minLength: 1}, rx_bytes_per_second: {type: number, minimum: 0}, tx_bytes_per_second: {type: number, minimum: 0}}
    HostMetricsResponse:
      type: object
      required: [schema_version, availability, stale_after_seconds]
      additionalProperties: false
      properties:
        schema_version: {type: integer, enum: [1]}
        availability: {type: string, enum: [available, warming_up, unavailable, unsupported]}
        observed_at: {type: string, format: date-time}
        stale_after_seconds: {type: integer, minimum: 1}
        cpu: {$ref: '#/components/schemas/HostMetricsCPU'}
        memory: {$ref: '#/components/schemas/HostMetricsMemory'}
        disk: {$ref: '#/components/schemas/HostMetricsDisk'}
        network: {$ref: '#/components/schemas/HostMetricsNetwork'}
    ProbeDeliveryRequest:
      type: object
      required: [protocol]
      additionalProperties: false
      properties: {protocol: {type: string, enum: [tcp, http]}, path: {type: string}}
    ProbeResponseFact:
      type: object
      required: [protocol, outcome, observed_at, fact_digest]
      additionalProperties: false
      properties: {protocol: {type: string, enum: [tcp, http]}, outcome: {type: string}, http_status: {type: integer, nullable: true}, latency_ms: {type: integer, format: int64}, error_code: {type: string}, observed_at: {type: string, format: date-time}, fact_digest: {type: string}}
    DeliveryLogItem:
      type: object
      required: [stream, recorded_at, content, truncation]
      additionalProperties: false
      properties:
        stream: {type: string, enum: [stdout, stderr, combined, unknown]}
        recorded_at: {type: string, format: date-time}
        content: {type: string, description: "Redacted log text; returned as the newest suffix when response limits apply."}
        truncation: {type: string, enum: [complete, source_limited, response_limited, unknown]}
    DeliveryLogsResponse:
      type: object
      required: [source, availability, items, next_cursor, retention_limited]
      additionalProperties: false
      properties:
        source: {type: string, enum: [build, runtime]}
        availability: {type: string, enum: [available, not_collected, retired]}
        items: {type: array, items: {$ref: '#/components/schemas/DeliveryLogItem'}}
        next_cursor: {type: string, nullable: true}
        retention_limited: {type: boolean, description: "True when source-specific older log indexes were retired; active items, if present, remain readable."}
    PublicAccessRequest:
      type: object
      required: [enabled]
      additionalProperties: false
      properties: {enabled: {type: boolean}}
    PublicAccessResponse:
      type: object
      required: [desired_public, url, endpoint, components, status]
      additionalProperties: false
      properties:
        desired_public: {type: boolean}
        url: {type: string, format: uri, description: "Derived HTTPS URL only; not a DNS TLS or Internet readiness claim."}
        endpoint: {type: object, required: [deployment_id], additionalProperties: false, properties: {deployment_id: {type: string}}}
        components: {type: object, required: [internal_endpoint, local_route, dns, tls, external], additionalProperties: false, properties: {internal_endpoint: {type: string, enum: [accepted, not_observed]}, local_route: {type: string, enum: [desired, reconcile_required, configured, disabled]}, dns: {type: string, enum: [not_validated]}, tls: {type: string, enum: [not_validated]}, external: {type: string, enum: [not_validated]}}}
        status: {type: string, enum: [PUBLIC_DISABLED, PENDING_EXTERNAL_VALIDATION]}
    ExternalAccessDNSObservation:
      type: object
      required: [state]
      additionalProperties: false
      properties: {state: {type: string, enum: [observed, failed]}, addresses: {type: array, items: {type: string}}, failure_code: {type: string, enum: [dns_no_answer, dns_timeout, dns_lookup_failed]}}
    ExternalAccessTLSObservation:
      oneOf:
        - type: object
          required: [state, certificate_sha256]
          additionalProperties: false
          properties: {state: {type: string, enum: [observed]}, certificate_sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}}
        - type: object
          required: [state, failure_code]
          additionalProperties: false
          properties: {state: {type: string, enum: [failed]}, failure_code: {type: string, enum: [tls_connect_failed, tls_name_mismatch, tls_certificate_invalid, tls_timeout]}}
        - type: object
          required: [state]
          additionalProperties: false
          properties: {state: {type: string, enum: [not_attempted]}}
    ExternalAccessHTTPSObservation:
      oneOf:
        - type: object
          required: [state, http_status, response_sample_sha256, response_sample_bytes, response_truncated]
          additionalProperties: false
          properties: {state: {type: string, enum: [observed]}, http_status: {type: integer, minimum: 100, maximum: 599}, response_sample_sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}, response_sample_bytes: {type: integer, minimum: 0, maximum: 65536}, response_truncated: {type: boolean}}
        - type: object
          required: [state, failure_code]
          additionalProperties: false
          properties: {state: {type: string, enum: [failed]}, failure_code: {type: string, enum: [https_timeout, https_transport_failed]}}
        - type: object
          required: [state]
          additionalProperties: false
          properties: {state: {type: string, enum: [not_attempted]}}
    ExternalAccessObservation:
      type: object
      required: [observer, application_id, deployment_id, hostname, report_id, observed_at, received_at, expires_at, dns, tls, https]
      additionalProperties: false
      properties: {observer: {type: string, enum: [administrator_client]}, application_id: {type: string}, deployment_id: {type: string}, hostname: {type: string}, report_id: {type: string}, observed_at: {type: string, format: date-time}, received_at: {type: string, format: date-time}, expires_at: {type: string, format: date-time}, dns: {$ref: '#/components/schemas/ExternalAccessDNSObservation'}, tls: {$ref: '#/components/schemas/ExternalAccessTLSObservation'}, https: {$ref: '#/components/schemas/ExternalAccessHTTPSObservation'}}
    ExternalAccessObservationReadResponse:
      type: object
      required: [availability]
      additionalProperties: false
      properties: {availability: {type: string, enum: [available, expired, not_observed]}, observation: {$ref: '#/components/schemas/ExternalAccessObservation'}}
    ExternalAccessObservationReportRequest:
      type: object
      required: [report_id, observed_at, dns, tls, https]
      additionalProperties: false
      properties: {report_id: {type: string, minLength: 1}, observed_at: {type: string, format: date-time}, dns: {$ref: '#/components/schemas/ExternalAccessDNSObservation'}, tls: {$ref: '#/components/schemas/ExternalAccessTLSObservation'}, https: {$ref: '#/components/schemas/ExternalAccessHTTPSObservation'}}
