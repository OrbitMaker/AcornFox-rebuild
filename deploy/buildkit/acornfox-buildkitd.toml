# Candidate-bound BuildKit policy. This file is packaged as
# config/acornfox-buildkitd.toml. The daemon runs inside the root-owned build
# network namespace; resolver addresses must match its fixed egress policy.
root = "/var/lib/acornfox/buildkit/buildkitd"

[dns]
  nameservers = ["1.1.1.1", "1.0.0.1"]

# Docker Official Images are also published in this public ECR namespace.
# BuildKit retains Docker Hub as fallback for images absent from that mirror.
# HTTPS verification remains enabled for both origins.
[registry."docker.io"]
  mirrors = ["public.ecr.aws/docker"]

[worker.oci]
  enabled = true
  rootless = true
  snapshotter = "native"
  max-parallelism = 1

[worker.containerd]
  enabled = false
