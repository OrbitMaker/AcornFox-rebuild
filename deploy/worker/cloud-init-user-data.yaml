#cloud-config
hostname: opencard-mvp-fa8f8eab-build-worker-01
manage_etc_hosts: true
ssh_pwauth: false
disable_root: true
package_update: false
package_upgrade: false
write_files:
  - path: /etc/opencard-mvp-fa8f8eab-clean-worker
    owner: root:root
    permissions: '0644'
    content: |
      opencard-mvp-fa8f8eab-build-worker-01
  - path: /usr/local/sbin/opencard-offline-bootstrap
    owner: root:root
    permissions: '0750'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      install -d -m 0750 /mnt/opencard-bundle /opt/opencard-offline/outer
      device=$(blkid -L OPENCARD_BUNDLE)
      test -b "$device"
      mount -o ro,nosuid,nodev,noexec "$device" /mnt/opencard-bundle
      (cd /mnt/opencard-bundle && sha256sum -c offline-bundle.sha256)
      tar -xf /mnt/opencard-bundle/offline-bundle.tar -C /opt/opencard-offline/outer
      python3 /opt/opencard-offline/outer/payload/offline_bundle.py validate \
        --archive /mnt/opencard-bundle/offline-bundle.tar
      bash /opt/opencard-offline/outer/payload/clean-worker-bootstrap.sh \
        /opt/opencard-offline/outer/payload
runcmd:
  - [bash, /usr/local/sbin/opencard-offline-bootstrap]
final_message: Open Card clean worker offline bootstrap finished
