apiVersion: v1
kind: Namespace
metadata:
  name: open-card-kruise
  labels:
    open-card.io/component: openkruise
---
apiVersion: apps.kruise.io/v1alpha1
kind: CloneSet
metadata:
  name: kruise-smoke
  namespace: open-card-kruise
  labels:
    app.kubernetes.io/name: kruise-smoke
    open-card.io/component: openkruise
spec:
  replicas: 1
  updateStrategy:
    type: InPlaceIfPossible
    maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kruise-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kruise-smoke
        open-card.io/component: openkruise
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
