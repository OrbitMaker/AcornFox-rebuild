apiVersion: v1
kind: Namespace
metadata:
  name: open-card-demo
  labels:
    open-card.io/component: demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-card-demo-nginx
  namespace: open-card-demo
  labels:
    app.kubernetes.io/name: open-card-demo
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      location / {
        try_files $uri /index.html;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-card-demo
  namespace: open-card-demo
  labels:
    app.kubernetes.io/name: open-card-demo
    open-card.io/component: demo
spec:
  replicas: 3
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app.kubernetes.io/name: open-card-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-card-demo
        open-card.io/component: demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command: ["/bin/sh", "-c"]
          args:
            - >-
              printf '<html><body><h1>Open Card demo</h1><p>pod=%s</p></body></html>\n' "$POD_NAME"
              > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: open-card-demo-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: open-card-demo
  namespace: open-card-demo
  labels:
    app.kubernetes.io/name: open-card-demo
    open-card.io/component: demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: open-card-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
