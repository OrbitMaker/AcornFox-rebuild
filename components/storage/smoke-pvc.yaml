apiVersion: v1
kind: Namespace
metadata:
  name: open-card-system
  labels:
    open-card.io/component: storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-local-smoke
  namespace: open-card-system
  labels:
    app.kubernetes.io/name: open-local-smoke
    open-card.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: open-local-lvm
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-local-smoke
  namespace: open-card-system
  labels:
    app.kubernetes.io/name: open-local-smoke
    open-card.io/component: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-local-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-local-smoke
        open-card.io/component: storage
    spec:
      containers:
        - name: smoke
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - >-
              test -f /data/open-card-marker || printf 'open-local-persistent\n' > /data/open-card-marker;
              exec sleep 3600
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-local-smoke
